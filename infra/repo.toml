# quirq infra (qq) manifest for website: pinned toolchains and typed targets, schema quirq-repo/1
# (quirq-ai/sync). Read and edit it only through qqsync (`qqsync show`, `qqsync pin`, or the
# qqsync.manifest library); never parse it any other way.
#
# Kind `gatsby-site` (Gatsby with pnpm) is listed in quirq-ai/infra-config config/kinds.toml. Its
# interim commands there are what CI runs: `pnpm build` (whose prebuild runs `pnpm apps:check`) and
# `pnpm test`. quirq-ai/recipes has no gatsby-site adapter yet, so `qq build` and `qq test` cannot
# run this target locally; use the pnpm commands in README.md until it does.
#
# The node pin is the one quirq-ai/toolchains promoted (promoted.toml, node 24.21.0 revision 1,
# built from 5739fee), the same pin innernet uses: `source` names the OCI image manifest and
# `digest` the layer in it, as quirq-ai/qq's `qq sync` fetches it. Only linux-x86_64 is built
# so far. The toolchain roller (quirq-ai/rollers) moves this pin; do not edit it by hand.
#
# Not in the canary yet: infra-config lists no channels for website. TODO(expert): deploy target.
# Vercel's GitHub app deploys a preview of each PR (its "Vercel" status), but the production target
# is not verified from here, so qq deploys nothing.
schema = "quirq-repo/1"

[[targets]]
name = "site"
kind = "gatsby-site"
srcs = ["src/**", "gatsby/**", "plugins/**", "scripts/**", "static/**", "contents/**", "functions/**", "patches/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "quirq.apps.json", "gatsby-browser.tsx", "gatsby-config.js", "gatsby-node.ts", "gatsby-ssr.js", "tailwind.config.js", "postcss.config.js", "tsconfig.json", "kea.js", "safelist.txt"]
outs = ["public/"]

[qq]
version = "0.1.0"

[toolchains.node]
version = "24.21.0"

[toolchains.node.platforms]
linux-x86_64 = {source = "oci://ghcr.io/quirq-ai/toolchains/node@sha256:a84e067c794c73ba5ecf72064bcb6940e67f51f3fce7803edc54040e8c69a173", digest = "sha256:8c0ab89a2bc9a397f443ae9196ec95535e60e5ead1378a920cf44b2b2b392d01"}
